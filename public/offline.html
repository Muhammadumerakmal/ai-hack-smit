<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>HCM Lite · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --fg: #18181b; --muted: #71717a; --card: #ffffff; --line: #e4e4e7; }
      @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #f4f4f5; --muted: #a1a1aa; --card: #18181b; --line: #27272a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 380px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 18px; margin: 14px 0 6px; }
      p { margin: 0 0 18px; color: var(--muted); }
      button { font: inherit; font-weight: 600; color: #fff; background: #0f766e; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
      button:hover { background: #115e59; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>HCM Lite needs a connection to check you in, show live attendance and keep your data up to date. Nothing was saved while offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
